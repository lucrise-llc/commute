<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="A resolver model chooses lines from both changes with both intents, and the stored resolution applies when the first change lands" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><title>A resolver model chooses lines from both changes with both intents, and the stored resolution applies when the first change lands</title><defs><marker id="ah-dim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#6e655b"/></marker><marker id="ah-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#e8933a"/></marker><marker id="ah-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#5fbf7f"/></marker><marker id="ah-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#e8685a"/></marker><marker id="ah-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#63a6f5"/></marker><marker id="ah-fg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#ece4d8"/></marker></defs><rect width="860" height="330" rx="10" fill="#171411"/><text x="28" y="38" font-size="11" fill="#a39787" text-anchor="start" font-weight="400" letter-spacing="1.2">RESOLVE A CONFLICT ONCE, BY CHOOSING LINES</text><rect x="24" y="62" width="262" height="52" rx="6" fill="#1e1a16" stroke="#3a322a" stroke-width="1"/><text x="38" y="83" font-size="12" fill="#a39787" text-anchor="start" font-weight="400">alice · c-142 · intent</text><text x="38" y="102" font-size="12" fill="#ece4d8" text-anchor="start" font-weight="400">tax is computed in pricing.ts</text><path d="M286 88 C 320 88, 316 150, 346 150" fill="none" stroke="#6e655b" stroke-width="1.4" marker-end="url(#ah-dim)"/><rect x="24" y="126" width="262" height="52" rx="6" fill="#1e1a16" stroke="#3a322a" stroke-width="1"/><text x="38" y="147" font-size="12" fill="#a39787" text-anchor="start" font-weight="400">bob · c-157 · intent</text><text x="38" y="166" font-size="12" fill="#ece4d8" text-anchor="start" font-weight="400">the discount applies before tax</text><path d="M286 152 C 320 152, 316 150, 346 150" fill="none" stroke="#6e655b" stroke-width="1.4" marker-end="url(#ah-dim)"/><rect x="24" y="190" width="262" height="52" rx="6" fill="#1e1a16" stroke="#e8685a" stroke-width="1"/><text x="38" y="211" font-size="12" fill="#a39787" text-anchor="start" font-weight="400">conflicting hunk · first push</text><text x="38" y="230" font-size="12" fill="#e8685a" text-anchor="start" font-weight="400">src/cart/pricing.ts</text><path d="M286 216 C 320 216, 316 150, 346 150" fill="none" stroke="#6e655b" stroke-width="1.4" marker-end="url(#ah-dim)"/><rect x="352" y="118" width="166" height="64" rx="6" fill="#1e1a16" stroke="#63a6f5" stroke-width="1"/><text x="435" y="146" font-size="13" fill="#63a6f5" text-anchor="middle" font-weight="600">resolver model</text><text x="435" y="166" font-size="11" fill="#a39787" text-anchor="middle" font-weight="400">answers with line IDs</text><line x1="518" y1="150" x2="552" y2="150" stroke="#6e655b" stroke-width="1.4" marker-end="url(#ah-dim)"/><rect x="558" y="98" width="278" height="104" rx="6" fill="#1e1a16" stroke="#5fbf7f" stroke-width="1"/><text x="574" y="120" font-size="13" fill="#5fbf7f" text-anchor="start" font-weight="600">resolution r-23</text><text x="574" y="138" font-size="11" fill="#a39787" text-anchor="start" font-weight="400">key: hash of the hunk 7e1c04</text><text x="574" y="162" font-size="11" fill="#ece4d8" text-anchor="start" font-weight="400">o1  subtotal = applyTier(subtotal)</text><text x="574" y="180" font-size="11" fill="#ece4d8" text-anchor="start" font-weight="400">t1  total = subtotal + computeTax()</text><line x1="697" y1="202" x2="697" y2="236" stroke="#5fbf7f" stroke-width="1.4" marker-end="url(#ah-green)"/><rect x="558" y="242" width="278" height="44" rx="6" fill="#171411" stroke="#3a322a" stroke-width="1"/><text x="574" y="269" font-size="12" fill="#ece4d8" text-anchor="start" font-weight="400">stored · applies when c-142 lands</text><rect x="24" y="260" width="400" height="52" rx="6" fill="#171411" stroke="#3a322a" stroke-width="1" stroke-dasharray="4 4"/><text x="38" y="281" font-size="12" fill="#ece4d8" text-anchor="start" font-weight="400">c-142 lands · c-157 restacks with r-23</text><text x="38" y="300" font-size="12" fill="#5fbf7f" text-anchor="start" font-weight="400">no second model call · one check runs again</text><path d="M558 270 C 500 270, 470 286, 428 286" fill="none" stroke="#5fbf7f" stroke-width="1.4" marker-end="url(#ah-green)"/></svg>
