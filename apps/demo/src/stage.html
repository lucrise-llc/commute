<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Commute demo</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 600px 1fr;
        grid-template-rows: 88px 1fr;
        font-family: system-ui, sans-serif;
        background: #fff;
      }
      #caption {
        grid-column: 1 / 3;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 24px;
        border-bottom: 1px solid #ccc;
      }
      #caption h1 {
        margin: 0;
        font-size: 24px;
      }
      #caption p {
        margin: 4px 0 0;
        font-size: 17px;
        color: #444;
      }
      #terminal {
        margin: 0;
        padding: 10px;
        background: #111;
        color: #ddd;
        font:
          12px/1.45 ui-monospace,
          Menlo,
          monospace;
        overflow: hidden;
        white-space: pre-wrap;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      #console {
        border: 0;
        width: 100%;
        height: 100%;
      }
      #card {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        justify-content: center;
        padding: 0 140px;
        background: #fff;
        font-size: 28px;
      }
      #card h1 {
        font-size: 56px;
        margin: 0 0 24px;
      }
      #card li {
        margin: 12px 0;
      }
    </style>
  </head>
  <body>
    <header id="caption">
      <h1></h1>
      <p></p>
    </header>
    <pre id="terminal"></pre>
    <iframe id="console" title="Commute console"></iframe>
    <section id="card"></section>
    <script>
      const terminal = document.getElementById('terminal');
      const caption = document.getElementById('caption');
      const card = document.getElementById('card');
      const LINES_SHOWN = 60;
      const source = new EventSource('/stream');
      source.addEventListener('line', (event) => {
        const line = document.createElement('div');
        line.textContent = JSON.parse(event.data);
        terminal.append(line);
        while (terminal.childElementCount > LINES_SHOWN) {
          terminal.firstElementChild.remove();
        }
      });
      source.addEventListener('caption', (event) => {
        const { title, text } = JSON.parse(event.data);
        caption.querySelector('h1').textContent = title;
        caption.querySelector('p').textContent = text;
      });
      source.addEventListener('card', (event) => {
        const { title, items } = JSON.parse(event.data);
        card.replaceChildren();
        if (title === null) {
          card.style.display = 'none';
          return;
        }
        const heading = document.createElement('h1');
        heading.textContent = title;
        const list = document.createElement('ul');
        for (const item of items) {
          const entry = document.createElement('li');
          entry.textContent = item;
          list.append(entry);
        }
        card.append(heading, list);
        card.style.display = 'flex';
      });
    </script>
  </body>
</html>
